name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Xcode and macOS 26 SDK
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install SwiftLint and xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint xcodegen

      - name: Lint (SwiftLint)
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Test
        run: make test

      - name: Typecheck x86_64 slice
        run: make typecheck-x86

      - name: Check localization keys
        run: make loc-check

      - name: Translation completeness
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/check-translations.py Crisp/Resources/Localizable.xcstrings
          else
            python3 scripts/check-translations.py Crisp/Resources/Localizable.xcstrings || true
          fi

      - name: Smoke build (arm64 Crisper-bin & crisperctl-bin)
        run: make compile
